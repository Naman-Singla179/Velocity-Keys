<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Velocity Keys // Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital@1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background-color: #000000; background-image: radial-gradient(circle at 50% -20%, #2e1065 0%, #000000 60%); color: #fafafa; min-height: 100vh; display: flex; flex-direction: column; }
    .topBar { display: flex; align-items: center; justify-content: space-between; padding: 0 60px; height: 80px; background: rgba(0, 0, 0, 0.1); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .logoText { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
    .logoText .blueWord { color: #c4b5fd; }
    .rightSide { display: flex; align-items: center; gap: 24px; }
    .statusPill { font-size: 0.65rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 14px; border-radius: 30px; background: rgba(196, 181, 253, 0.1); color: #c4b5fd; border: 1px solid rgba(196, 181, 253, 0.2); }
    .backLink { text-decoration: none; font-size: 0.85rem; font-weight: 400; letter-spacing: 0.05em; text-transform: uppercase; color: #a1a1aa; transition: 0.3s; }
    .backLink:hover { color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
    .mainContainer { flex: 1; max-width: 820px; margin: 0 auto; width: 100%; padding: 48px 24px 80px; }
    
    .statsBox { display: flex; gap: 1px; background: rgba(255,255,255,0.05); border-radius: 20px; overflow: hidden; margin-bottom: 32px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .boxPart { flex: 1; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); padding: 20px 24px; display: flex; flex-direction: column; gap: 4px; }
    .smallGreyText { font-size: 0.65rem; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.1em; }
    .bigText { font-size: 1.5rem; font-weight: 800; color: #e9d5ff; font-family: 'JetBrains Mono', monospace; }

    /* The Practice Canvas */
    .practiceCanvas { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; padding: 48px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); cursor: text; position: relative; min-height: 250px; }
    .practiceCanvas:focus-within { border-color: rgba(196, 181, 253, 0.5); box-shadow: 0 0 30px rgba(196, 181, 253, 0.1); }
    
    /* GHOST TEXT MAGIC CSS */
    .typing-display { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; line-height: 1.8; color: #3f3f46; word-spacing: 4px; user-select: none; }
    
    .char { position: relative; border-bottom: 2px solid transparent; }
    .char.correct { color: #fafafa; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
    .char.incorrect { color: #fda4af; border-bottom: 2px solid #fda4af; background: rgba(253, 164, 175, 0.15); border-radius: 3px; }
    
    /* Blinking Cursor */
    .char.cursor { border-left: 2px solid #c4b5fd; margin-left: -2px; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { border-left-color: transparent; } 50% { border-left-color: #c4b5fd; } }

    /* Hidden Input to capture mobile & desktop keyboards natively */
    #hiddenInput { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; }
    
    .helperText { text-align: center; font-size: 0.8rem; color: #71717a; margin-top: 16px; }
  </style>
</head>
<body>
  <nav class="topBar">
    <div class="logoText">Velocity<span class="blueWord">Keys</span></div>
    <div class="rightSide">
      <span class="statusPill" id="modePill">Practice</span>
      <a href="practice-setup.html" class="backLink">Cancel</a>
    </div>
  </nav>

  <div class="mainContainer">
    <div class="statsBox">
      <div class="boxPart">
        <span class="smallGreyText">Goal</span>
        <span class="bigText" id="val1">0 words</span>
      </div>
      <div class="boxPart">
        <span class="smallGreyText">Stopwatch</span>
        <span class="bigText" id="val2">0.0s</span>
      </div>
      <div class="boxPart">
        <span class="smallGreyText">Progress</span>
        <span class="bigText" id="val3">0%</span>
      </div>
    </div>
    
    <!-- Clicking this box focuses the invisible input -->
    <div class="practiceCanvas" onclick="document.getElementById('hiddenInput').focus()">
      <input type="text" id="hiddenInput" autocomplete="off" spellcheck="false" autocorrect="off">
      <div id="typingDisplay" class="typing-display">Loading practice text...</div>
    </div>
    <p class="helperText">Click the box to focus. Start typing to begin the stopwatch.</p>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       VELOCITY KEYS - PRACTICE MODULE (GHOST TEXT)
    ════════════════════════════════════════════════════════════════ */
    var wordCountTarget = 25;
    var targetText = "";
    var timerStarted = false;
    var timerInterval = null;
    var timeElapsed = 0; // Stopwatch, counts UP
    
    function getParams() {
      var urlParams = new URLSearchParams(window.location.search);
      wordCountTarget = parseInt(urlParams.get("words")) || 25;
      document.getElementById("val1").textContent = wordCountTarget + " words";
      document.getElementById("modePill").textContent = "Practice: " + wordCountTarget;
    }

    function loadPracticeData() {
      fetch("passages.json")
        .then(res => res.json())
        .then(data => {
          // Combine all levels of text into one massive string of words
          var allSentences = (data.easy || []).concat(data.medium || []).concat(data.hard || []);
          var allWords = allSentences.join(" ").split(/\s+/);
          
          // Shuffle the words randomly
          for (var i = allWords.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = allWords[i];
            allWords[i] = allWords[j];
            allWords[j] = temp;
          }
          
          // Slice the exact number of words requested
          targetText = allWords.slice(0, wordCountTarget).join(" ").toLowerCase();
          
          // Set the max length of the hidden input so they can't over-type
          document.getElementById('hiddenInput').maxLength = targetText.length;
          renderText();
        })
        .catch(err => {
          console.warn("JSON blocked. Using failsafe.");
          targetText = "the quick brown fox jumps over the lazy dog and types very fast".repeat(10).split(" ").slice(0, wordCountTarget).join(" ");
          document.getElementById('hiddenInput').maxLength = targetText.length;
          renderText();
        });
    }

    function startStopwatch() {
      if (timerStarted) return;
      timerStarted = true;
      timerInterval = setInterval(function() {
        timeElapsed += 0.1;
        document.getElementById("val2").textContent = timeElapsed.toFixed(1) + "s";
      }, 100);
    }

    // This is the Ghost Text magic: Render every character as a span
    function renderText() {
      var userInput = document.getElementById('hiddenInput').value;
      var html = "";
      
      // Update progress bar percentage
      var progress = Math.round((userInput.length / targetText.length) * 100) || 0;
      document.getElementById("val3").textContent = progress + "%";

      for (var i = 0; i < targetText.length; i++) {
        var char = targetText[i];
        var typedChar = userInput[i];
        var className = "char";

        // Add blinking cursor to the current character
        if (i === userInput.length) className += " cursor";

        if (typedChar === undefined) {
          // Not typed yet, stays low opacity grey
        } else if (typedChar === char) {
          className += " correct"; // Turns white
        } else {
          className += " incorrect"; // Turns red
        }

        html += "<span class='" + className + "'>" + char + "</span>";
      }
      
      // If completed, add cursor to the very end
      if (userInput.length === targetText.length) {
         html += "<span class='char cursor'></span>";
      }

      document.getElementById('typingDisplay').innerHTML = html;

      // Auto-submit when length is met
      if (userInput.length === targetText.length && targetText.length > 0) {
        finishPractice(userInput);
      }
    }

    function finishPractice(finalInput) {
      clearInterval(timerInterval);
      if (timeElapsed < 1) timeElapsed = 1; // Prevent math errors
      
      var correctCount = 0;
      for (var i = 0; i < finalInput.length; i++) {
        if (finalInput[i] === targetText[i]) correctCount++;
      }
      
      var errors = finalInput.length - correctCount;
      var accuracy = Math.round((correctCount / finalInput.length) * 100);
      
      // Gross WPM formula
      var wpm = Math.round((finalInput.length / 5) / (timeElapsed / 60));

      var url = "results.html?wpm=" + wpm + "&acc=" + accuracy + "&correct=" + correctCount + 
                "&errors=" + errors + "&level=practice" + 
                "&time=" + timeElapsed.toFixed(1) + "&limit=" + wordCountTarget; // Storing word count in limit
      
      window.location.href = url;
    }

    function init() {
      getParams();
      loadPracticeData();
      
      var hiddenBox = document.getElementById('hiddenInput');
      // Listen to the hidden input
      hiddenBox.addEventListener('input', function(e) {
        startStopwatch();
        renderText();
      });
      
      // Focus the invisible box automatically when page loads
      hiddenBox.focus();
    }

    window.onload = init;
  </script>
</body>
</html>
