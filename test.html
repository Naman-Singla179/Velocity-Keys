<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Velocity Keys // Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital@1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body { 
      font-family: 'Outfit', sans-serif; 
      background-color: #000000;
      background-image: radial-gradient(circle at 50% -20%, #2e1065 0%, #000000 60%);
      color: #fafafa; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }

    .topBar { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 60px; 
      height: 80px; 
      background: rgba(0, 0, 0, 0.1); 
      backdrop-filter: blur(20px); 
      border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
      flex-shrink: 0; 
    }

    .logoText { 
      font-size: 1.25rem; 
      font-weight: 800; 
      letter-spacing: -0.02em; 
    }

    .logoText .blueWord { 
      color: #c4b5fd; 
    }

    .rightSide { 
      display: flex; 
      align-items: center; 
      gap: 24px; 
    }

    .statusPill { 
      font-size: 0.65rem; 
      font-weight: 800; 
      letter-spacing: 0.1em; 
      text-transform: uppercase; 
      padding: 6px 14px; 
      border-radius: 30px; 
    }

    .greenPill { 
      background: rgba(110, 231, 183, 0.1); 
      color: #6ee7b7; 
      border: 1px solid rgba(110, 231, 183, 0.2); 
    }

    .yellowPill { 
      background: rgba(253, 224, 71, 0.1); 
      color: #fde047; 
      border: 1px solid rgba(253, 224, 71, 0.2); 
    }

    .redPill { 
      background: rgba(253, 164, 175, 0.1); 
      color: #fda4af; 
      border: 1px solid rgba(253, 164, 175, 0.2); 
    }

    .backLink { 
      text-decoration: none; 
      font-size: 0.85rem; 
      font-weight: 400; 
      letter-spacing: 0.05em; 
      text-transform: uppercase; 
      color: #a1a1aa; 
      transition: 0.3s; 
    }

    .backLink:hover { 
      color: #ffffff; 
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); 
    }
    
    .mainContainer { 
      flex: 1; 
      max-width: 820px; 
      margin: 0 auto; 
      width: 100%; 
      padding: 48px 24px 80px; 
    }

    .links { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      font-size: 0.78rem; 
      color: #71717a; 
      margin-bottom: 32px; 
      letter-spacing: 0.05em; 
      text-transform: uppercase; 
    }

    .links a { 
      color: #71717a; 
      text-decoration: none; 
      transition: 0.3s; 
    }

    .links a:hover { 
      color: #c4b5fd; 
    }

    .links .here { 
      color: #fafafa; 
      font-weight: 600; 
    }
    
    .statsBox { 
      display: flex; 
      gap: 1px; 
      background: rgba(255,255,255,0.05); 
      border-radius: 20px; 
      overflow: hidden; 
      margin-bottom: 32px; 
      border: 1px solid rgba(255,255,255,0.05); 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    }

    .boxPart { 
      flex: 1; 
      background: rgba(0,0,0,0.4); 
      backdrop-filter: blur(10px); 
      padding: 20px 24px; 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
    }

    .smallGreyText { 
      font-size: 0.65rem; 
      font-weight: 600; 
      color: #71717a; 
      text-transform: uppercase; 
      letter-spacing: 0.1em; 
    }

    .bigText { 
      font-size: 1.5rem; 
      font-weight: 800; 
      color: #e9d5ff; 
      letter-spacing: -0.02em; 
      text-shadow: 0 0 15px rgba(233, 213, 255, 0.2); 
    }
    
    .whiteBox1, .whiteBox2 { 
      background: rgba(255, 255, 255, 0.02); 
      backdrop-filter: blur(15px); 
      border: 1px solid rgba(255, 255, 255, 0.05); 
      border-radius: 24px; 
      padding: 32px 36px; 
      margin-bottom: 24px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
    }

    .boxTop { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 20px; 
    }

    .boxTitle { 
      font-size: 0.75rem; 
      font-weight: 600; 
      color: #a1a1aa; 
      text-transform: uppercase; 
      letter-spacing: 0.1em; 
    }

    .tinyGreyText { 
      font-size: 0.75rem; 
      color: #71717a; 
    }
    
    #textToType { 
      font-family: 'JetBrains Mono', monospace; 
      font-size: 1.1rem; 
      line-height: 1.9; 
      color: #a1a1aa; 
      word-spacing: 4px; 
    }
    
    .whiteBox2 { 
      transition: border-color 0.3s, box-shadow 0.3s; 
    }

    .whiteBox2:focus-within { 
      border-color: rgba(196, 181, 253, 0.5); 
      box-shadow: 0 0 30px rgba(196, 181, 253, 0.1); 
    }

    #myTextBox { 
      width: 100%; 
      font-family: 'JetBrains Mono', monospace; 
      font-size: 1.1rem; 
      line-height: 1.9; 
      color: #fafafa; 
      border: none; 
      outline: none; 
      resize: none; 
      height: 148px; 
      background: transparent; 
      word-spacing: 4px; 
    }

    #myTextBox::placeholder { 
      color: #3f3f46; 
      font-style: italic; 
    }
    
    .boxBottom { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-top: 16px; 
      padding-top: 16px; 
      border-top: 1px solid rgba(255,255,255,0.05); 
    }

    .bgLine { 
      flex: 1; 
      height: 4px; 
      background: rgba(255,255,255,0.05); 
      border-radius: 4px; 
      overflow: hidden; 
      margin-right: 20px; 
    }

    .blueLine { 
      height: 100%; 
      background: #c4b5fd; 
      border-radius: 4px; 
      width: 0%; 
      transition: width 0.2s; 
      box-shadow: 0 0 10px #c4b5fd; 
    }

    #numberText { 
      font-size: 0.75rem; 
      color: #71717a; 
      white-space: nowrap; 
      font-family: 'JetBrains Mono', monospace; 
    }
    
    #readyTag { 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      font-size: 0.65rem; 
      font-weight: 800; 
      text-transform: uppercase; 
      letter-spacing: 0.1em; 
      padding: 6px 14px; 
      border-radius: 30px; 
      background: rgba(110, 231, 183, 0.1); 
      color: #6ee7b7; 
      border: 1px solid rgba(110, 231, 183, 0.2); 
    }

    #readyTag.isTyping { 
      background: rgba(196, 181, 253, 0.1); 
      color: #c4b5fd; 
      border-color: rgba(196, 181, 253, 0.2); 
    }
    
    .btnContainer { 
      display: flex; 
      gap: 16px; 
      flex-wrap: wrap; 
      margin-top: 32px; 
    }

    .darkBtn { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      background: #ffffff; 
      color: #000000; 
      font-size: 0.85rem; 
      font-weight: 800; 
      letter-spacing: 0.05em; 
      text-transform: uppercase; 
      padding: 16px 40px; 
      border-radius: 50px; 
      text-decoration: none; 
      border: none;
      cursor: pointer;
      transition: all 0.3s; 
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); 
    }

    .darkBtn:hover { 
      transform: scale(1.05); 
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3); 
    }

    .lightBtn { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      letter-spacing: 0.05em; 
      text-transform: uppercase; 
      padding: 16px 32px; 
      border-radius: 50px; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      background: rgba(255, 255, 255, 0.02); 
      color: #fafafa; 
      text-decoration: none; 
      cursor: pointer;
      transition: 0.3s; 
    }

    .lightBtn:hover { 
      background: rgba(255, 255, 255, 0.05); 
      border-color: rgba(255, 255, 255, 0.2); 
    }
  </style>
</head>
<body>
  <nav class="topBar">
    <div class="logoText">Velocity<span class="blueWord">Keys</span></div>
    <div class="rightSide">
      <span class="statusPill yellowPill" id="pill1">Medium</span>
      <a href="levels.html" class="backLink">Return</a>
    </div>
  </nav>

  <div class="mainContainer">
    <div class="links">
      <a href="index.html">Home</a>
      <span>/</span>
      <a href="levels.html">Levels</a>
      <span>/</span>
      <span class="here" id="link3">Session</span>
    </div>
    
    <div class="statsBox">
      <div class="boxPart">
        <span class="smallGreyText">Protocol</span>
        <span class="bigText" id="val1">Medium</span>
      </div>
      <div class="boxPart">
        <span class="smallGreyText">Timer</span>
        <span class="bigText" id="val2">45.0s</span>
      </div>
      <div class="boxPart">
        <span class="smallGreyText">Words</span>
        <span class="bigText" id="val3">—</span>
      </div>
      <div class="boxPart">
        <span class="smallGreyText">Chars</span>
        <span class="bigText" id="val4">—</span>
      </div>
    </div>
    
    <div class="whiteBox1">
      <div class="boxTop">
        <span class="boxTitle">Target Sequence</span>
        <span class="tinyGreyText" id="wordNum"></span>
      </div>
      <p id="textToType">Loading passage...</p>
    </div>
    
    <div class="whiteBox2">
      <div class="boxTop">
        <span class="boxTitle">Input Console</span>
        <span id="readyTag">Awaiting</span>
      </div>
      <textarea id="myTextBox" placeholder="Initiate keystrokes to begin..." spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      <div class="boxBottom">
        <div class="bgLine">
          <div class="blueLine" id="blueLine"></div>
        </div>
        <span id="numberText">0 / 0</span>
      </div>
    </div>
    
    <div class="btnContainer">
      <button class="darkBtn" onclick="submitTest()">Submit Data →</button>
      <button class="lightBtn" onclick="clearInput()">Clear</button>
    </div>
  </div>
<script>
    /* ═══════════════════════════════════════════════════════════════
       VELOCITY KEYS - TYPING TEST MODULE (FINAL MATH FIX)
    ════════════════════════════════════════════════════════════════ */

    var selectedLevel = "medium";
    var timeLimit = 45;
    var passageText = "";
    var totalChars = 0;
    var totalWords = 0;

    var timerStarted = false;
    var timerInterval = null;
    var timeRemaining = 0;
    var startTime = 0;
    var endTime = 0;

    var levelConfig = {
      easy:   { time: 60, label: "Easy",   pill: "greenPill" },
      medium: { time: 45, label: "Medium", pill: "yellowPill" },
      hard:   { time: 30, label: "Hard",   pill: "redPill" }
    };

    function getLevelFromURL() {
      var url = window.location.search;
      if (url.indexOf("level=easy") !== -1) return "easy";
      if (url.indexOf("level=hard") !== -1) return "hard";
      return "medium";
    }

    function loadPassage() {
      fetch("passages.json")
        .then(function(response) {
          if (!response.ok) throw new Error("Could not load file.");
          return response.json();
        })
        .then(function(data) {
          if (!data[selectedLevel] || data[selectedLevel].length === 0) throw new Error("Level not found.");
          var passages = data[selectedLevel];
          passageText = passages[Math.floor(Math.random() * passages.length)];
          displayPassage();
        })
        .catch(function(error) {
          // FAILSAFE: If JSON is blocked, use these built-in sentences so the app STILL works perfectly!
          console.warn("JSON blocked. Loading failsafe backup text.");
          var backupText = {
            easy: "the cat sat on the mat and ate a big red hat",
            medium: "learning to type faster can improve your daily productivity and help you",
            hard: "extraordinary circumstances require considerable determination and comprehensive understanding"
          };
          passageText = backupText[selectedLevel] || backupText.medium;
          displayPassage();
        });
    }

    function displayPassage() {
      totalChars = passageText.length;
      totalWords = passageText.split(/\s+/).length;
      
      document.getElementById("textToType").textContent = passageText;
      document.getElementById("val3").textContent = totalWords;
      document.getElementById("val4").textContent = totalChars;
      document.getElementById("wordNum").textContent = totalWords + " words · " + totalChars + " chars";
      document.getElementById("numberText").textContent = "0 / " + totalChars;
    }

    function updateProgress() {
      var textarea = document.getElementById("myTextBox");
      var typed = textarea.value.length;
      var percent = Math.min((typed / totalChars) * 100, 100);
      
      document.getElementById("numberText").textContent = typed + " / " + totalChars;
      document.getElementById("blueLine").style.width = percent + "%";
      
      var tag = document.getElementById("readyTag");
      if (typed === 0) {
        tag.textContent = "Awaiting"; tag.className = "";
      } else {
        tag.textContent = "Active"; tag.className = "isTyping";
      }
    }

    function startTimer() {
      if (timerStarted) return;
      timerStarted = true;
      timeRemaining = timeLimit;
      startTime = Date.now();
      
      timerInterval = setInterval(function() {
        timeRemaining--;
        document.getElementById("val2").textContent = timeRemaining.toFixed(1) + "s";
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          submitTest();
        }
      }, 1000);
    }

    function clearInput() {
      document.getElementById("myTextBox").value = "";
      document.getElementById("numberText").textContent = "0 / " + totalChars;
      document.getElementById("blueLine").style.width = "0%";
      document.getElementById("readyTag").textContent = "Awaiting";
      document.getElementById("readyTag").className = "";
      document.getElementById("myTextBox").focus();
    }

    function submitTest() {
      if (timerInterval) clearInterval(timerInterval);
      endTime = Date.now();
      
      // Calculate time safely
      var actualTime = timerStarted ? ((endTime - startTime) / 1000) : 0;
      if (timerStarted && actualTime < 1) actualTime = 1; 
      
      var typedText = document.getElementById("myTextBox").value.trim();
      
      // If box is totally empty, give 0s
      if (typedText === "") {
        window.location.href = "results.html?wpm=0&acc=0&correct=0&errors=0&level=" + selectedLevel + "&time=0&limit=" + timeLimit;
        return;
      }
      
      // Convert to lowercase to ignore capital letters
      var typedWords = typedText.toLowerCase().split(/\s+/);
      var originalWords = passageText.toLowerCase().trim().split(/\s+/);
      
      var correctCount = 0;
      for (var i = 0; i < typedWords.length; i++) {
        if (typedWords[i] === originalWords[i]) correctCount++;
      }
      
      var errorCount = Math.max(0, typedWords.length - correctCount);
      var accuracy = typedWords.length > 0 ? Math.round((correctCount / typedWords.length) * 100) : 0;
      
      // NEW STANDARD TYPING TEST MATH: Gross WPM
      // This calculates speed based on total keystrokes (1 word = 5 chars)
      // This guarantees you get a speed score even if you type random gibberish to test it!
      var charsTyped = typedText.length;
      var wpm = actualTime > 0 ? Math.round((charsTyped / 5) / (actualTime / 60)) : 0;
      
      var url = "results.html?wpm=" + wpm + "&acc=" + accuracy + "&correct=" + correctCount + 
                "&errors=" + errorCount + "&level=" + selectedLevel + 
                "&time=" + actualTime.toFixed(1) + "&limit=" + timeLimit;
      
      window.location.href = url;
    }

    function init() {
      selectedLevel = getLevelFromURL();
      var config = levelConfig[selectedLevel];
      timeLimit = config.time;
      timeRemaining = timeLimit;
      
      document.getElementById("pill1").textContent = config.label;
      document.getElementById("pill1").className = "statusPill " + config.pill;
      document.getElementById("link3").textContent = config.label + " Session";
      document.getElementById("val1").textContent = config.label;
      document.getElementById("val2").textContent = timeLimit.toFixed(1) + "s";
      
      loadPassage();
      
      document.getElementById("myTextBox").addEventListener("paste", function(e) { e.preventDefault(); });
      document.getElementById("myTextBox").onkeydown = function(e) {
        if (!timerStarted && e.key.length === 1 && e.key !== " ") startTimer();
      };
      document.getElementById("myTextBox").onkeyup = function() { updateProgress(); };
    }

    window.onload = init;
  </script>
</body>
</html>
